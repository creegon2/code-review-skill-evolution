[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-skill-evolution"
version = "0.1.0"
description = "A data-free reference framework for auditable code-review Skill evolution."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "creegon" }]
keywords = ["code-review", "skill-evolution", "evaluation", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
]

[project.scripts]
crse-offline-smoke = "code_review_skill_evolution.demo:main"

[project.urls]
Homepage = "https://github.com/creegon2/code-review-skill-evolution"
Repository = "https://github.com/creegon2/code-review-skill-evolution"
Issues = "https://github.com/creegon2/code-review-skill-evolution/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
